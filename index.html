<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Suppress benign Vite HMR websocket connection errors in iframe/preview environments
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason ? (e.reason.message || String(e.reason)) : '';
        if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('websocket') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = e.message || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
    </script>
    <title>DesiReels - Trending Video Discovery & Reels Aggregator</title>
